{{- if and .Values.metrics.enabled .Values.metrics.exporter.enabled }}
# The exporter exports every Argo CD Application's cost to Prometheus. Cost is global state, so it runs
# as one replica, like kube-state-metrics: several would each export the same series. Recreate keeps
# two from running during an upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cost-intelligence-argocd.fullname" . }}-exporter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
    component: exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cost-intelligence-argocd.selectorLabels" . | nindent 6 }}
      component: exporter
  template:
    metadata:
      {{- if or .Values.commonAnnotations .Values.metrics.podAnnotations (include "cost-intelligence-argocd.clusterMap.enabled" .) }}
      annotations:
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "cost-intelligence-argocd.metrics.scrapeAnnotations" . | nindent 8 }}
        {{- if include "cost-intelligence-argocd.clusterMap.enabled" . }}
        # Restart the pods when the cluster map changes: it is read at startup.
        checksum/cluster-map: {{ include "cost-intelligence-argocd.clusterMap.json" . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "cost-intelligence-argocd.selectorLabels" . | nindent 8 }}
        component: exporter
    spec:
      # Lists Argo CD Applications, which the ClusterRole allows.
      serviceAccountName: {{ include "cost-intelligence-argocd.serviceAccountName" . }}
      {{- if .Values.security.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: exporter
        image: "{{ .Values.costIntelligence.image.repository }}:{{ .Values.costIntelligence.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.costIntelligence.image.pullPolicy }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        env:
        - name: MODE
          value: exporter
        - name: METRICS_PORT
          value: {{ .Values.metrics.port | quote }}
        - name: EXPORTER_INTERVAL
          value: {{ .Values.metrics.exporter.interval | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.costIntelligence.logLevel | quote }}
        {{- with .Values.costIntelligence.ownerLabels }}
        - name: OWNER_LABELS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with .Values.costIntelligence.nonOwnerKinds }}
        - name: NON_OWNER_KINDS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with .Values.costIntelligence.unownedPodLabels }}
        - name: UNOWNED_POD_LABELS
          value: {{ join "," . | quote }}
        {{- end }}
        # PostgreSQL, for the cloud estimates CI pushes.
        - name: DB_HOST
          value: {{ include "cost-intelligence-argocd.postgres.host" . | quote }}
        - name: DB_PORT
          value: "{{ include "cost-intelligence-argocd.postgres.port" . }}"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "cost-intelligence-argocd.postgres.secretName" . }}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "cost-intelligence-argocd.postgres.secretName" . }}
              key: password
        - name: DB_NAME
          value: {{ .Values.postgres.auth.database | quote }}
        - name: DB_SSL_MODE
          value: {{ .Values.postgres.sslMode | quote }}
        - name: OPENCOST_BASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "cost-intelligence-argocd.openCost.secretName" . }}
              key: opencost-base-url
        - name: OPENCOST_TIMEOUT
          value: {{ .Values.openCost.timeout | quote }}
        - name: COST_PROVIDER
          value: {{ .Values.openCost.provider | default "opencost" | quote }}
        {{- if eq (.Values.openCost.provider | default "opencost") "kubecost" }}
        - name: KUBECOST_CLUSTER_ID
          value: {{ required "openCost.kubecostClusterID is required when openCost.provider is kubecost: Kubecost answers for every cluster it knows" .Values.openCost.kubecostClusterID | quote }}
        {{- end }}
        {{- if include "cost-intelligence-argocd.clusterMap.enabled" . }}
        - name: KUBECOST_CLUSTER_MAP_FILE
          value: /etc/cost-intelligence/clusters.json
        {{- end }}
        {{- if not .Values.openCost.discoverClusters }}
        - name: KUBECOST_DISCOVER_CLUSTERS
          value: "false"
        {{- end }}
        {{- if .Values.openCost.eksOptimized }}
        - name: KUBECOST_EKS_OPTIMIZED
          value: "true"
        {{- end }}
        {{- if .Values.openCost.shareTenancyCosts }}
        - name: KUBECOST_SHARE_TENANCY_COSTS
          value: "true"
        {{- end }}
        {{- with .Values.openCost.shareNamespaces }}
        - name: KUBECOST_SHARE_NAMESPACES
          value: {{ join "," . | quote }}
        {{- end }}
        {{- if .Values.openCost.externalCosts }}
        - name: KUBECOST_EXTERNAL_COSTS
          value: "true"
        {{- end }}
        {{- with .Values.openCost.apiKey.existingSecret }}
        - name: KUBECOST_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ . | quote }}
              key: {{ $.Values.openCost.apiKey.key | default "api-key" | quote }}
        - name: KUBECOST_API_KEY_HEADER
          value: {{ $.Values.openCost.apiKey.header | default "Authorization" | quote }}
        {{- end }}
        {{- if .Values.security.containerSecurityContext }}
        securityContext:
          {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
        {{- end }}
        {{- with .Values.metrics.exporter.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if .Values.healthChecks.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: {{ .Values.healthChecks.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.healthChecks.startupProbe.failureThreshold }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: 10
          timeoutSeconds: 5
        # Ready once the first refresh has finished, which takes one OpenCost query per namespace.
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 5
          timeoutSeconds: 5
        {{- if include "cost-intelligence-argocd.clusterMap.enabled" . }}
        volumeMounts:
        - name: cluster-map
          mountPath: /etc/cost-intelligence
          readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "cost-intelligence-argocd.clusterMap.enabled" . }}
      volumes:
      - name: cluster-map
        configMap:
          name: {{ include "cost-intelligence-argocd.fullname" . }}-clusters
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cost-intelligence-argocd.fullname" . }}-exporter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
    component: exporter
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    {{- include "cost-intelligence-argocd.selectorLabels" . | nindent 4 }}
    component: exporter
{{- end }}
